---
- name: Install python apt library
  shell: |
    apt update
    apt install python3-apt -y && touch python3_apt.success
  args:
    creates: python3_apt.success

- name: Install required packages
  apt:
    name: "{{ debian_packages }}"

- name: Import the key
  get_url:
    url: "{{ elastic_gpg_key_url }}"
    dest: /etc/apt/keyrings/elasticsearch.asc
    mode: "0644"

- name: Add ES apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/elasticsearch.asc] https://artifacts.elastic.co/packages/{{ elastic_version }}/apt stable main"
    state: present

- name: Install elasticsearch
  apt:
    name: elasticsearch
